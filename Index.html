<!-- SUPABASE LIVE WIRE-UP - Review Queue + Stats from real Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gywylsxzkmxhuxsqgdis.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_AQ-VfPTwd2zipmGDf58t5Q_gvYPNt4K";
let supabaseClient = null;
try { supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e){ console.log("Supabase init", e); }

async function loadLiveData(){
  if(!supabaseClient || SUPABASE_ANON_KEY.includes("PASTE")) { console.log("Add Publishable key to index.html to load live data"); return; }
  try {
    const { data: pending } = await supabaseClient.from('pending_reviews').select('*').eq('status','pending').order('id',{ascending:false});
    const { data: stats } = await supabaseClient.from('stats').select('*').order('id',{ascending:false}).limit(200);
    const { data: tourns } = await supabaseClient.from('tournaments').select('*').order('id',{ascending:false});
    console.log("Supabase live:", {pending: pending?.length, stats: stats?.length, tourns: tourns?.length});
    window.livePending = pending || [];
    window.liveStats = stats || [];
    window.liveTournaments = tourns || [];
    window.dispatchEvent(new CustomEvent('circuit-live-loaded', {detail:{pending: pending||[], stats: stats||[], tourns: tourns||[]}}));
    // Try to render into any Review Queue container
    const containers = document.querySelectorAll('[data-review-queue], #review-queue-list, #reviewQueue');
    if (pending && pending.length>0) {
      const htmlPending = pending.map(r=>{
        const players = (r.raw_json && r.raw_json.players) ? r.raw_json.players : [];
        const lines = players.map(p=>`${p.gamertag} (${p.team}): ${p.pts} PTS / ${p.reb} REB / ${p.ast} AST / ${p.stl} STL / ${p.blk} BLK`).join('<br>');
        return `<div style="border:1px solid #333;padding:14px;margin-bottom:14px;border-radius:12px;background:#111">
          <b>Review #${r.id} - ${r.tournament}</b> - by ${r.uploader}<br>
          ${r.image_url ? `<img src="${r.image_url}" style="max-width:100%;max-height:320px;border-radius:10px;margin:10px 0;object-fit:contain">` : ''}
          <div style="font-size:13px;line-height:1.6">${lines}</div>
          <div style="margin-top:10px;display:flex;gap:8px">
            <button onclick="approveLiveReview(${r.id})" style="background:#FFD400;color:#000;padding:10px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:700">Approve & Publish</button>
            <button onclick="rejectLiveReview(${r.id})" style="background:#222;color:#fff;padding:10px 16px;border:1px solid #444;border-radius:8px;cursor:pointer">Reject</button>
          </div>
        </div>`;
      }).join('');
      containers.forEach(el=>{ if(el) el.innerHTML = htmlPending; });
    }
  } catch(e){ console.log("loadLiveData error", e); }
}
async function approveLiveReview(id){
  if(!supabaseClient) return;
  // Get review, then insert its players into stats and mark approved
  const { data } = await supabaseClient.from('pending_reviews').select('*').eq('id', id).single();
  if(!data) { alert("Review not found"); return; }
  const players = data.raw_json?.players || [];
  const series = prompt("Series label (e.g. Semifinal 1 - Team 1 vs Team 2):", data.series_label || "");
  if(series===null) return;
  const gameNum = parseInt(prompt("Game number (1,2,3):", data.game_number || 1) || "1");
  for(const p of players){
    await supabaseClient.from('stats').insert([{gamertag:p.gamertag, team:p.team, pts:p.pts, reb:p.reb, ast:p.ast, stl:p.stl, blk:p.blk, tov:p.tov, fouls:p.fouls, fgm:p.fgm, fga:p.fga, tpm:p.tpm, tpa:p.tpa, ftm:p.ftm, fta:p.fta, tournament:data.tournament, series_label:series, game_number:gameNum, format:data.format||'BO1'}]);
  }
  await supabaseClient.from('pending_reviews').update({status:'approved', series_label:series, game_number:gameNum}).eq('id', id);
  alert("Approved #" + id + " - now live in stats");
  loadLiveData();
}
async function rejectLiveReview(id){
  if(!supabaseClient) return;
  await supabaseClient.from('pending_reviews').update({status:'rejected'}).eq('id', id);
  loadLiveData();
}
document.addEventListener('DOMContentLoaded', loadLiveData);
setInterval(loadLiveData, 30000);
</script>
